# Project-wide Gradle settings
# IDE (e.g. Android Studio) users: settings in this file override IDE settings

# JVM memory for Gradle daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Parallel execution
org.gradle.parallel=true
org.gradle.configureondemand=true

# Caching
org.gradle.caching=true

# Android
android.enableJetifier=true
android.useAndroidX=true

# NDK
android.ndkVersion=26.1.10909125

# Kotlin
kotlin.version=1.9.20
kotlin.coroutines.version=1.8.0

# Versiones de la app
app.version.code=332
app.version.name=3.0.332-gyro

# Min/Target SDK
minSdk=24
targetSdk=34
compileSdk=34

# ABI splits (para reducir tamaño APK)
abi.enableArm64=true
abi.enableArm=true
abi.enableX86=false
abi.enableX86_64=false

# Signing (configurado en keystore.properties)
# storeFile=keystore/release.keystore
# storePassword=*****
# keyAlias=release
# keyPassword=*****