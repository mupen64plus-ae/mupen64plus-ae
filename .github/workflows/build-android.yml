# Nome do Workflow
name: Build Android APK

# Gatilho: Permite iniciar o build manualmente na aba "Actions"
on:
  workflow_dispatch:

jobs:
  build:
    # Usa a versão mais recente do Ubuntu como ambiente de compilação
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código-fonte do seu repositório
      # O "submodules: 'recursive'" é CRÍTICO para este projeto,
      # pois ele usa sub-módulos para o núcleo do emulador.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. Configura o ambiente Java (JDK), necessário para o Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Dá permissão de execução para o script do Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Inicia a compilação (build) do APK de Debug
      # Usamos 'assembleDebug' porque não requer chaves de assinatura.
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. Carrega o APK gerado como um "artefato" para download
      # O APK fica disponível na página de resumo do workflow após a conclusão.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mupen64plus-ae-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
